<html lang="pl"><head><meta charset="utf-8">
<link rel="stylesheet" href="/node_modules/@fontsource/inter/400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/inter/700.css">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; font-family: Inter, sans-serif;
    background: radial-gradient(ellipse 80% 55% at 47% 42%, #F2F2F3 0%, #E6E6E8 55%, #CFCFD3 100%); }
  canvas { position: absolute; inset: 0; }
  .ov { position: absolute; left: 95px; width: 830px; text-align: center; color: #0F0F10; white-space: nowrap; }
  .w { display: inline-block; }
  #lead { top: 262px; font-size: 58px; letter-spacing: -0.02em; }
  #kw { top: 330px; font-weight: 700; line-height: 1; letter-spacing: -0.045em; }
  #res { top: 1020px; font-weight: 700; line-height: 1; letter-spacing: -0.06em; font-variant-numeric: tabular-nums; }
  #resT { top: 1322px; font-size: 64px; font-weight: 700; letter-spacing: -0.025em; }
  #fail { left: 0; width: auto; top: 0; height: 76px; padding: 0 30px; border-radius: 38px; display: flex; align-items: center; font-size: 46px; font-weight: 700; letter-spacing: -0.01em; color: #fff; text-align: left; transform-origin: 50% 100%; box-shadow: 0 14px 30px rgba(227,38,43,.28); }
  #fail::after { content: ''; position: absolute; left: 50%; bottom: -12px; margin-left: -13px; border: 13px solid transparent; border-bottom: 0; border-top-color: var(--pill); }
  svg#lead-line { position: absolute; left: 0; top: 0; overflow: visible; }
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="ov" id="lead"></div><div class="ov" id="kw"></div>
<div class="ov" id="fail"></div><div class="ov" id="res"></div><div class="ov" id="resT"></div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (s) => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, s, d) => clamp((t - s) / d);
const expoOut = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const backOut = (x, c = 2.2) => 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2);
const blurIn = (el, t, at, dur = 0.45, dist = 24, blur = 16) => { const p = prog(t, at, dur), e = expoOut(p); el.style.opacity = clamp(p * 2.5); el.style.filter = `blur(${(1 - e) * blur}px)`; el.style.transform = `translateY(${(1 - e) * dist}px) scale(${0.95 + 0.05 * e})`; };
let P, renderer, scene, camera, keys = [], ctx2d;

function fitPx(text, weight, max, width, track = 0) {
  ctx2d = ctx2d || document.createElement('canvas').getContext('2d');
  let s = max; while (s > 20) { ctx2d.font = `${weight} ${s}px Inter`; if (ctx2d.measureText(text).width + track * s * (text.length - 1) <= width) break; s -= 2; } return s;
}
function labelTex(text, color) {
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = `700 ${fitPx(text, 700, 250, 400)}px Inter`;
  g.fillText(text, 256, 270); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}

window.setup = async (props) => {
  P = props; const C = P.colors;
  await Promise.all(['400', '700'].map((w) => document.fonts.load(`${w} 64px Inter`, 'AĄĘŚŁÓŻŹĆŃ ąęśłóżźćń')));
  // nakładka typograficzna
  $('#lead').innerHTML = P.lead.split(' ').map((w) => `<span class="w">${w}</span>`).join(' ');
  $('#kw').textContent = P.keyword; $('#kw').style.fontSize = fitPx(P.keyword, 700, 128, 760, -0.045) + 'px';
  $('#resT').textContent = P.resultText; $('#fail').textContent = P.failText;
  $('#fail').style.background = P.colors.failUi; document.documentElement.style.setProperty('--pill', P.colors.failUi);
  $('#res').style.fontSize = fitPx(`${P.days.length - 1}/${P.days.length}`, 700, 300, 700, -0.06) + 'px';
  // scena 3D
  renderer = new THREE.WebGLRenderer({ canvas: $('#c'), antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(1080, 1920, false);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; renderer.outputColorSpace = THREE.SRGBColorSpace;
  scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.55;
  const sun = new THREE.DirectionalLight(0xffffff, 2.4); sun.position.set(-3.5, 9, 4.5); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 30 }); sun.shadow.radius = 14; sun.shadow.blurSamples = 20; sun.shadow.bias = -0.0006;
  scene.add(sun, new THREE.HemisphereLight(0xffffff, 0xbfbfc4, 0.6));
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: 0.22 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  camera = new THREE.PerspectiveCamera(28, 1080 / 1920, 0.1, 200);
  // klawisze: 4 + 3 jak rząd klawiatury
  const geo = new RoundedBoxGeometry(1, 0.5, 1, 6, 0.15);
  P.days.forEach((d, i) => {
    const row = i < 4 ? 0 : 1, col = row ? i - 4 : i, n = row ? 3 : 4;
    const x = (col - (n - 1) / 2) * 1.2, z = row ? 0.66 : -0.62;
    const mat = new THREE.MeshPhysicalMaterial({ color: C.key, roughness: 0.42, clearcoat: 0.5, clearcoatRoughness: 0.3 });
    const mesh = new THREE.Mesh(geo, mat); mesh.castShadow = mesh.receiveShadow = true;
    const mk = (col) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.8), new THREE.MeshBasicMaterial({ map: labelTex(d.label, col), transparent: true, toneMapped: false })); m.rotation.x = -Math.PI / 2; m.position.y = 0.2505; return m; };
    const dark = mk('#111112'), light = mk('#FFFFFF'); light.visible = false; mesh.add(dark, light);
    scene.add(mesh); keys.push({ mesh, mat, dark, light, x, z, d, i });
  });
};

const KEY = new THREE.Color(), DONE = new THREE.Color(), FAIL = new THREE.Color();
window.seek = (t) => {
  const C = P.colors, T = P.timing; KEY.set(C.key); DONE.set(C.done); FAIL.set(C.fail);
  let okCount = 0, failShown = 0;
  keys.forEach((k) => {
    // wejście: spadek z odbiciem
    const drop = prog(t, 0.08 + k.i * 0.05, 0.55), y0 = drop < 1 ? (1 - backOut(drop, 1.6)) * 1.5 : 0;
    // wciśnięcie (dzień po dniu)
    const failIdx = P.days.findIndex((d) => !d.ok);
    const tp = T.firstPress + k.i * T.pressGap + (failIdx >= 0 && k.i > failIdx ? T.failPause : 0), a = t - tp; k.tp = tp;
    let press = 0; if (a > 0 && a < 0.08) press = a / 0.08; else if (a >= 0.08 && a < 0.14) press = 1; else if (a >= 0.14 && a < 0.4) press = 1 - backOut(prog(a, 0.14, 0.26), 2.4);
    const flipped = a >= 0.08, f = clamp((a - 0.08) / (k.d.ok ? 0.15 : 0.05));
    if (flipped) { k.mat.color.copy(KEY).lerp(k.d.ok ? DONE : FAIL, f); k.dark.visible = f < 0.5; k.light.visible = f >= 0.5; if (k.d.ok && f >= 0.5) okCount++; if (!k.d.ok) failShown = Math.max(failShown, prog(t, tp + 0.08, 0.2)); }
    else { k.mat.color.copy(KEY); k.dark.visible = true; k.light.visible = false; }
    // fala po zakończeniu tygodnia (drugi beat)
    const wv = prog(t, T.wave + k.i * 0.07, 0.42), wave = Math.sin(wv * Math.PI) * 0.28 * (wv > 0 && wv < 1 ? 1 : 0);
    const failSink = !k.d.ok && flipped ? 0.06 * f : 0;
    const fp = !k.d.ok ? prog(t, tp + 0.1, 0.5) : 0, pop = !k.d.ok && fp > 0 && fp < 1 ? Math.sin(fp * Math.PI) : 0;
    k.mesh.scale.setScalar(1 + 0.14 * pop); k.mesh.rotation.y = !k.d.ok ? 0.12 * Math.sin(fp * Math.PI * 4) * (1 - fp) : 0;
    k.mesh.position.set(k.x, 0.25 + y0 - 0.17 * press - failSink + wave + 0.25 * pop, k.z);
    k.mesh.rotation.z = (1 - clamp(drop * 1.4)) * 0.4 * (k.i % 2 ? 1 : -1);
  });
  // kamera: lekki najazd + powolne okrążanie (żaden kadr nie stoi)
  // dystans dobrany tak, by cały układ (~4.6 j. szer.) mieścił się w ~75% szerokości kadru
  const az = -0.1 + 0.09 * Math.sin(t * 0.55), el = 0.92, r = 22.4 - 1.0 * clamp(t / P.duration);
  camera.position.set(Math.sin(az) * Math.cos(el) * r, Math.sin(el) * r, Math.cos(az) * Math.cos(el) * r); camera.lookAt(0.05, 0, 0.05);
  camera.setViewOffset(1080, 1920, 20, 128, 1080, 1920); camera.updateProjectionMatrix();  // klawisze w pasie y ~600–960, x wokół 510
  renderer.render(scene, camera);
  // typografia
  document.querySelectorAll('#lead .w').forEach((w, i) => blurIn(w, t, 0.05 + i * 0.1));
  const kp = prog(t, 0.25, 0.55), ke = expoOut(kp); const kw = $('#kw');
  kw.style.opacity = clamp(kp * 2.5); kw.style.filter = `blur(${(1 - ke) * 24}px)`; kw.style.transform = `scale(${1.18 - 0.18 * ke})`;
  const total = P.days.length; const res = $('#res');
  res.textContent = `${okCount}/${total}`; blurIn(res, t, T.firstPress - 0.2, 0.45, 20, 18);
  const okKeys = keys.filter((k) => k.d.ok), last = okKeys[okKeys.length - 1];
  const bump = okKeys.map((k) => prog(t, k.tp + 0.12, 0.22)).reduce((m, p) => Math.max(m, p > 0 && p < 1 ? Math.sin(p * Math.PI) : 0), 0);
  const fin = prog(t, last.tp + 0.2, 0.5), finPop = fin > 0 && fin < 1 ? Math.sin(fin * Math.PI) : 0;   // pop po ostatnim dniu
  res.style.transform += ` scale(${1 + 0.04 * bump + 0.08 * finPop})`;
  blurIn($('#resT'), t, T.firstPress - 0.1, 0.5, 20, 16);
  // pigułka „wpadka" przypięta nad czerwonym klawiszem (pozycja bazowa, bez bujania), w granicach strefy bezpiecznej
  const fk = keys.find((k) => !k.d.ok), fl = $('#fail');
  if (fk) {
    const v = new THREE.Vector3(fk.x, 0.5, fk.z - 0.42).project(camera);
    const sx = (v.x + 1) / 2 * 1080, sy = (1 - v.y) / 2 * 1920, w = fl.offsetWidth;
    const e = backOut(clamp(failShown), 2.6);
    fl.style.left = `${Math.min(940 - w, Math.max(80, sx - w / 2))}px`; fl.style.top = `${sy - 76 - 26}px`;
    fl.style.opacity = failShown > 0 ? 1 : 0; fl.style.transform = `scale(${failShown > 0 ? e : 0})`;
  }
};
</script></body></html>
